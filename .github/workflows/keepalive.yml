name: Keep the sync project awake

# Free Supabase projects pause after a week without requests. One tiny call every three days keeps it up.
# GitHub stops scheduled workflows after 60 days without commits; a push to main starts them again.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
